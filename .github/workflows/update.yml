name: Update betting models

on:
  schedule:
    - cron: "7 15,19,23 * * *"   # about 10:07am, 2:07pm, 6:07pm Eastern
  workflow_dispatch:              # adds a "Run workflow" button for on-demand updates

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: betting-models
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all models
        env:
          TZ: America/New_York
        run: python run_all_models.py --no-open
      - name: Save the downloaded game data (makes later runs fast)
        run: |
          git config user.name "models-bot"
          git config user.email "models-bot@users.noreply.github.com"
          git add *_data.json
          git commit -m "Update game data" || echo "No data changes"
          git push
      - name: Prepare web page
        run: |
          mkdir -p site
          cp all_models.html site/index.html
          cp nba_ats_model.html nfl_ats_model.html cbb_ats_model.html cfb_ats_model.html nhl_ml_model.html site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
